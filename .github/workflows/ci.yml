# CI for open-editor-backend (gap G5).
#
# The backend had no workflow at all: 403 tests only ever ran on one laptop.
# This runs them on every push, and — crucially — runs the MIGRATION tests
# against a REAL MySQL service, which is the one thing local sqljs runs cannot
# cover (see tests/migration-sql.test.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Both repos are now checked out side by side, so every `run:` step must
    # execute inside THIS repo rather than the parent workspace directory.
    defaults:
      run:
        working-directory: open-editor-text-backend

    services:
      # Production builds its schema from migration files against MySQL, while
      # every other test uses sqljs + synchronize. Without a real MySQL here,
      # the migration SQL would remain unexecuted until the first deploy.
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: oe_migration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # This repo is checked out into a directory NAMED for the repo, so the
      # sibling checkout below lands next to it — reproducing the local layout
      #     <parent>/open-editor-text-backend
      #     <parent>/open-editor
      # which six test files rely on via `../../open-editor/packages/...`.
      - uses: actions/checkout@v4
        with:
          path: open-editor-text-backend

      # ⚠️ REQUIRED, not convenience. Six suites import the REAL entitlements
      # verifier from the editor repo to prove the backend's signer and the
      # editor's verifier agree. Without this checkout they fail to load
      # entirely ("Failed to load url ../../open-editor/..."), which is exactly
      # how CI's first-ever run failed: 340 tests passed and 6 FILES could not
      # even be parsed.
      #
      # Copying or mocking those files would defeat the whole point — the test
      # exists because the two implementations must not drift apart.
      - uses: actions/checkout@v4
        with:
          repository: ami130/open-editor
          path: open-editor

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # `defaults.working-directory` applies to `run:` steps ONLY — an
          # action's own inputs are still resolved from the workspace root. With
          # the repo now checked out into a subdirectory, the lockfile is no
          # longer at the root and caching would fail to find it.
          cache-dependency-path: open-editor-text-backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `licenses` must exist before the delivery migration adds columns to it.
      # Created directly rather than by running the whole migration chain, so a
      # failure here is unambiguously about the delivery migration.
      - name: Prepare migration-test schema
        run: |
          mysql -h 127.0.0.1 -u root oe_migration_test \
            -e "CREATE TABLE IF NOT EXISTS licenses (id varchar(36) PRIMARY KEY)"

      - name: Test
        env:
          # Enables tests/migration-sql.test.ts. Without it those tests SKIP —
          # loudly, but they skip, so CI must always set this.
          TEST_MYSQL_URL: mysql://root@127.0.0.1:3306/oe_migration_test
        run: npx vitest run

      # A skipped migration suite in CI would silently restore the exact blind
      # spot G1 closed, so assert it actually ran.
      - name: Assert migration tests were NOT skipped
        env:
          TEST_MYSQL_URL: mysql://root@127.0.0.1:3306/oe_migration_test
        run: |
          npx vitest run tests/migration-sql.test.ts --reporter=json > /tmp/mig.json
          node -e "
            const r = require('/tmp/mig.json');
            if (!r.numTotalTests || r.numPassedTests < r.numTotalTests) {
              console.error('migration SQL tests did not all run/pass');
              process.exit(1);
            }
            console.log('migration SQL tests ran:', r.numPassedTests);
          "
